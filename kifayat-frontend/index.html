<!doctype html>
<html lang="en-PK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="application-name" content="Kifayat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kifayat" />

    <!-- Default SEO — overridden per-route by react-helmet-async -->
    <title>Kifayat | Online Shopping in Pakistan - Official Store</title>
    <meta name="description" content="Shop online at Kifayat.co for quality fashion, home goods, and electronics in Pakistan. We deliver all over Pakistan — fast, flat-fee shipping and cash on delivery nationwide." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph defaults (canonical + og:url set per-route by react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kifayat" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:title" content="Kifayat | Online Shopping in Pakistan - Official Store" />
    <meta property="og:description" content="Shop online at Kifayat.co for quality fashion, home goods, and electronics in Pakistan. We deliver all over Pakistan — fast, flat-fee shipping and cash on delivery nationwide." />
    <meta property="og:image" content="https://www.kifayat.co/og-default.jpg" />
    <meta property="og:image:secure_url" content="https://www.kifayat.co/og-default.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kifayat" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@kifayatpk" />
    <meta name="twitter:title" content="Kifayat | Online Shopping in Pakistan - Official Store" />
    <meta name="twitter:description" content="Shop online at Kifayat.co for quality fashion, home goods, and electronics in Pakistan. We deliver all over Pakistan — fast, flat-fee shipping and cash on delivery nationwide." />
    <meta name="twitter:image" content="https://www.kifayat.co/og-default.jpg" />
    <meta name="twitter:image:alt" content="Kifayat — Pakistan's trusted online store" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/logo.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest?v=4" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="color-scheme" content="dark light" />

    <!-- Critical font preloads for above-the-fold display and body text. -->
    <link rel="preload" href="/fonts/8vIH7w4qzmVxm2BL9A.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/LDIoaomQNQcsA88c7O9yZ4KMCoOg4Ko20yw.woff2" as="font" type="font/woff2" crossorigin />

    <!-- cache-flush marker: forces a fresh edge cache on every deploy -->

    <!-- DNS prefetch & preconnect for performance. Preconnect opens the TLS
         handshake early for the API backend (every page fetches /api through
         the rewrite) and the raw image CDN (fallback origin used by product
         image URLs). Safe under the strict CSP: connection hints are not
         governed by connect-src, and image responses render same-origin via
         /_vercel/image. -->
    <link rel="dns-prefetch" href="https://www.kifayat.co" />
    <link rel="dns-prefetch" href="https://p01--kifayat-backend--62p9lfb7xpvc.code.run" />
      <link rel="preconnect" href="https://p01--kifayat-backend--62p9lfb7xpvc.code.run" crossorigin />
    </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
