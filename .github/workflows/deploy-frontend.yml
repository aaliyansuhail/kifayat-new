name: Build & Deploy Frontend (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-frontend
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PRERENDER_PRODUCT_LIMIT: "500"
      PRERENDER_PRODUCT_DEADLINE_MS: "600000"
      PRERENDER_PRODUCT_CONCURRENCY: "15"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kifayat-frontend/package-lock.json

      - name: Install dependencies
        working-directory: kifayat-frontend
        run: npm ci

      - name: Install Chromium with system dependencies
        working-directory: kifayat-frontend
        run: npx playwright install --with-deps chromium

      - name: Build (sitemaps + vite + prerender)
        working-directory: kifayat-frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Verify prerender succeeded
        working-directory: kifayat-frontend
        run: |
          count=$(grep -o "<article" dist/index.html | wc -l)
          echo "Prerendered product cards on homepage: $count"
          if [ "$count" -lt 60 ]; then
            echo "::error::Prerender failed: expected >=60 <article> cards in dist/index.html, got $count"
            exit 1
          fi

      - name: Build validation complete
        run: echo "Cloudflare Pages Git integration will deploy this commit."
